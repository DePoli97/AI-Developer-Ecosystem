[project]
name = "claude-api-starter"
version = "0.1.0"
description = "Minimal opinionated Python starter for Claude API applications"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py310"
